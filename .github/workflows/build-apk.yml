name: Build Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run Calendar Engine tests
        run: dart test/engine_test.dart

      - name: Run Flutter Widget tests
        run: flutter test

      - name: Build Android Release APK
        run: |
          flutter build apk --release
          mkdir -p release-apk
          cp build/app/outputs/flutter-apk/app-release.apk release-apk/patro-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: patro-android-apk
          path: release-apk/patro-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest APK Build' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          draft: false
          prerelease: false
          files: release-apk/patro-release.apk
          body: |
            ### 🇳🇵 Patro (पात्रो) Mobile APK

            **Release Information**:
            - **Commit**: `${{ github.sha }}`
            - **Architecture**: Universal APK (ARM64, ARMv7, x86_64)
            - **Target**: Android 6.0+ (API 21+)
            - **Privacy**: 100% Offline, Zero Firebase, Zero Trackers
            - **Key Features**: Clean Bikram Sambat date calendar, Home Screen Widget support, BS ↔ AD converter, and in-app GitHub sync for 2084+.

            **Installation Instructions**:
            1. Download `patro-release.apk` directly on your Android phone.
            2. Tap the notification / downloaded file and select **Install**.
            3. If prompted, enable "Install unknown apps" for your browser.
            4. Long-press your home screen to add the **पात्रो (Patro)** widget!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
